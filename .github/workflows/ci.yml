name: CI

# Validates the word data and builds the site on every push and pull request.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -yq poppler-utils

      - name: Raw word lists match the PDFs
        run: |
          python3 scripts/parse-pdfs.py
          git diff --exit-code data/raw || (echo "data/raw is out of date: run npm run parse-pdfs and commit" && exit 1)

      - run: npm ci
      - run: npm test
      - name: Word files are in sync with data/raw
        run: |
          npm run sync-words
          git diff --exit-code data/words || (echo "Run npm run sync-words and commit" && exit 1)
      - name: Validate word data
        run: npm run validate
      - name: Example sentences stay within their level
        run: npm run check-vocab
      - name: Build site
        run: npm run build
      - name: Install browser for UI regression tests
        run: npx playwright install --with-deps chromium
      - name: Verify learning flows in desktop and mobile appearances
        run: npm run test:ui
